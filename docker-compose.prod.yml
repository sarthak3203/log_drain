services:
  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./server/src/db/schema.sql:/schema.sql:ro
    command: ["sh", "-c", "psql \"$${DATABASE_URL}\" -v ON_ERROR_STOP=1 -f /schema.sql"]

  python-ml:
    build:
      context: ./python-ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-10000}
      PYTHON_ML_URL: http://python-ml:8000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./server
    command: node dist/workers/index.js
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-10000}
      PYTHON_ML_URL: http://python-ml:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
